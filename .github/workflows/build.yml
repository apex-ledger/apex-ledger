# Apex Ledger: tests on every push, and a Windows installer on request or on a version tag.
#
# Code only travels here; company files, web data and installers stay out of the repository
# (see .gitignore). The installer is built on a GitHub-hosted Windows runner and attached to the
# workflow run as an artifact for download.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-rebuild -f -w better-sqlite3
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npm run verify:test-build
      - name: Web build
        run: npm run build:web

  installer:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-rebuild -f -w better-sqlite3
      - name: Build the bundled demo companies
        run: |
          npm run build
          node scripts/create-fictitious-company.mjs
          node scripts/create-comprehensive-demo.mjs
      - name: Build the installer
        run: npx electron-builder --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/**/*.exe
          if-no-files-found: error
